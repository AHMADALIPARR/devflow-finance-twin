name: Idris clone gate
on:
  push:
    paths: ['formal/clone-gate/**', '.github/workflows/clone-gate.yml']
  pull_request:
    paths: ['formal/clone-gate/**', '.github/workflows/clone-gate.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install bootstrap dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y chezscheme build-essential libgmp-dev
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: compiler
        with:
          path: ~/.idris2
          key: idris2-ubuntu24-15a3e4e70843f7a34100f6470c04b791330788df-v1
      - name: Bootstrap pinned Idris 2
        if: steps.compiler.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/idris-lang/Idris2.git "$RUNNER_TEMP/Idris2"
          cd "$RUNNER_TEMP/Idris2"
          git checkout 15a3e4e70843f7a34100f6470c04b791330788df
          make bootstrap SCHEME=chezscheme
          make install
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: steps.compiler.outputs.cache-hit != 'true'
        with:
          path: ~/.idris2
          key: idris2-ubuntu24-15a3e4e70843f7a34100f6470c04b791330788df-v1
      - name: Check, build and run clone gate
        run: |
          export PATH="$HOME/.idris2/bin:$PATH"
          cd formal/clone-gate
          set -o pipefail
          mkdir -p evidence
          idris2 --version | tee evidence/compiler.txt
          idris2 --total --check CloneGate.idr 2>&1 | tee evidence/gate.txt
          idris2 --total --check CloneGate/Linear.idr 2>&1 | tee evidence/linear.txt
          idris2 --total --check Main.idr 2>&1 | tee evidence/consumer.txt
          idris2 --total -o clone-gate-test Main.idr 2>&1 | tee evidence/build.txt
          build/exec/clone-gate-test | tee evidence/smoke.txt
          grep -Fx 'clone-gate: checks passed' evidence/smoke.txt
          idris2 --total -o attestation-test AttestationSmoke.idr 2>&1 | tee evidence/attestation-build.txt
          build/exec/attestation-test | tee evidence/attestation-smoke.txt
          grep -Fx 'attestation: checks passed' evidence/attestation-smoke.txt
          idris2 --build clone-gate.ipkg 2>&1 | tee evidence/package.txt
          build/exec/clone-gate | tee evidence/entry-point.txt
          printf '==> Clone gate open.\n==> Executing guarded payload.\n' > evidence/expected-entry.txt
          diff -u evidence/expected-entry.txt evidence/entry-point.txt
          make check 2>&1 | tee evidence/native-interface.txt
      - name: Require invalid external callers to fail typechecking
        run: |
          export PATH="$HOME/.idris2/bin:$PATH"
          cd formal/clone-gate
          for fixture in Negative/Locked.idr Negative/Spent.idr Negative/Reuse.idr Negative/Forged.idr Negative/Bypass.idr; do
            name=$(basename "$fixture" .idr)
            if idris2 --total --check "$fixture" > "evidence/$name.txt" 2>&1; then
              cat "evidence/$name.txt"
              echo "Invalid caller unexpectedly compiled: $fixture"
              exit 1
            fi
            cat "evidence/$name.txt"
            grep -Eiq 'mismatch|linear|accessible|undefined name|multiplicit|used|private' "evidence/$name.txt"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: clone-gate-evidence
          path: formal/clone-gate/evidence/
