[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "devflow-build-your-own-bank"
version = "0.1.0a1"
description = "Build Your Own Bank: local treasury engine and integration development kit"
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-Sovereign-Leviathan-SL-AGPL3-001"
license-files = ["LICENSE*", "LICENSES/*.txt", "src/LICENSE*"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
byob-bank = "cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["worm", "twin", "audit", "quantum", "cli", "icp_anchor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
